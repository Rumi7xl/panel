<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RUMİ7XL PANEL</title>

<style>

*{
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}


body{

margin:0;
background:#070710;
color:white;

}


.container{

width:1200px;
max-width:95%;
margin:auto;
padding:40px 0;

}



.header{

display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:40px;

}



.logo{

font-size:40px;
font-weight:900;
color:#a855ff;
text-shadow:
0 0 10px #a855ff,
0 0 30px #a855ff;

}



.online{

background:#18e65c;
color:#000;
padding:12px 25px;
border-radius:30px;
font-weight:bold;

}



.box{

background:#151522;
border:1px solid #29293d;
border-radius:25px;
padding:30px;
margin-bottom:25px;

}



.profile-name{

font-size:30px;
font-weight:900;
color:#a855ff;

}



.grid{

display:grid;
grid-template-columns:repeat(3,1fr);
gap:25px;

}



.card{

background:#151522;
border:1px solid #29293d;
border-radius:25px;
padding:30px;
transition:.3s;

}



.card:hover{

transform:translateY(-8px);
box-shadow:0 0 30px #8b5cf6;

}



.card-title{

font-size:24px;
font-weight:bold;
margin-bottom:20px;

}



.number{

font-size:45px;
font-weight:900;
color:#a855ff;

}



.status-dot{

width:18px;
height:18px;
border-radius:50%;
display:inline-block;
margin-right:10px;

}



.green{

background:#00ff55;

}


.red{

background:#ff0033;

}


.gray{

background:#555;

}



.small{

font-size:18px;
margin-top:10px;

}



.followers{

background:#151522;
border-radius:25px;
border:1px solid #29293d;
padding:30px;

}



.user{

padding:15px;
border-bottom:1px solid #29293d;
font-size:18px;

}



.user:last-child{

border:none;

}



@media(max-width:800px){


.grid{

grid-template-columns:1fr;

}


.logo{

font-size:28px;

}


}


</style>

</head>


<body>


<div class="container">


<div class="header">


<div class="logo">
🚀 RUMİ7XL PANEL
</div>


<div class="online">
🟢 ONLINE
</div>


</div>


<div class="box">


<h2>Profil</h2>

<div class="profile-name" id="name">
Yükleniyor...
</div>


<p id="owner"></p>


</div>


<div class="grid">


<div class="card">


<div class="card-title">

<span class="status-dot green"></span>
Kick

</div>


<div class="number" id="kickFollowers">
0
</div>


<div class="small">
Takipçi
</div>


<div class="small" id="kickSubs">
</div>


</div>





<div class="card">


<div class="card-title">

<span class="status-dot red"></span>
YouTube

</div>


<div class="number" id="youtube">
0
</div>


<div class="small">
Abone
</div>


</div>





<div class="card">


<div class="card-title">

<span class="status-dot gray"></span>
TikTok

</div>


<div class="number" id="tiktok">
0
</div>


<div class="small">
Takipçi
</div>


</div>



</div>


<br>
<div class="followers">


<h2>
👥 Son Takipçiler
</h2>


<div id="followersList">

Yükleniyor...

</div>


</div>


</div>



<script>


const API = "https://panel-ao8e.onrender.com/api/stats";



fetch(API)

.then(response=>response.json())

.then(data=>{


// PROFİL

document.getElementById("name").innerHTML =
data.profile.name;


document.getElementById("owner").innerHTML =
"Sahibi: " + data.profile.owner;




// KICK

document.getElementById("kickFollowers").innerHTML =
data.kick.followers.toLocaleString("tr-TR");



document.getElementById("kickSubs").innerHTML =
"Abone: " + data.kick.subscribers.toLocaleString("tr-TR");





// YOUTUBE

document.getElementById("youtube").innerHTML =
data.youtube.subscribers.toLocaleString("tr-TR");





// TIKTOK

document.getElementById("tiktok").innerHTML =
data.tiktok.followers.toLocaleString("tr-TR");






// TAKİPÇİ LİSTESİ


let html="";


data.kick.latestFollowers.forEach(user=>{


html += `

<div class="user">

👤 ${user}

</div>

`;


});



document.getElementById("followersList").innerHTML = html;



})



.catch(error=>{


console.log("API HATASI:",error);


document.getElementById("followersList").innerHTML =
"API bağlantı hatası";


});



</script>



</body>

</html>
