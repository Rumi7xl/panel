<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RUMİ7XL PANEL</title>


<style>

*{
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}


body{

    margin:0;
    min-height:100vh;
    background:#080810;
    color:white;

}


.container{

    width:1100px;
    max-width:95%;
    margin:auto;
    padding:40px 0;

}



.header{

    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:40px;

}



.logo{

    font-size:35px;
    font-weight:900;
    color:#a855ff;
    text-shadow:0 0 20px #a855ff;

}


.live{

    background:#16e05a;
    padding:10px 20px;
    border-radius:30px;
    color:black;
    font-weight:bold;

}



.profile{

    background:#151522;
    padding:25px;
    border-radius:20px;
    margin-bottom:25px;
    border:1px solid #26263a;

}



.cards{

    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;

}



.card{

    background:#151522;
    padding:25px;
    border-radius:20px;
    border:1px solid #26263a;

    transition:.3s;

}



.card:hover{

    transform:translateY(-8px);
    box-shadow:0 0 25px #8b5cf6;

}



.title{

    font-size:22px;
    font-weight:bold;
    margin-bottom:15px;

}



.number{

    font-size:35px;
    color:#a855ff;
    font-weight:900;

}



.followers{

    margin-top:30px;
    background:#151522;
    padding:25px;
    border-radius:20px;

}



.user{

    padding:10px;
    border-bottom:1px solid #29293b;

}



@media(max-width:800px){

.cards{

grid-template-columns:1fr;

}

}


</style>


</head>


<body>


<div class="container">


<div class="header">

<div class="logo">
🚀 RUMİ7XL PANEL
</div>


<div class="live">
🟢 ONLINE
</div>


</div>



<div class="profile">

<h2>Profil</h2>

<h3 id="name"></h3>

<p id="owner"></p>

</div>




<div class="cards">



<div class="card">

<div class="title">
🟢 Kick
</div>

<div class="number" id="kickFollowers">
0
</div>

<p>Takipçi</p>


<div id="kickSubs"></div>


</div>





<div class="card">

<div class="title">
🔴 YouTube
</div>

<div class="number" id="youtube">
0
</div>

<p>Abone</p>

</div>





<div class="card">

<div class="title">
⚫ TikTok
</div>

<div class="number" id="tiktok">
0
</div>

<p>Takipçi</p>

</div>




</div>





<div class="followers">

<h2>
👥 Son Takipçiler
</h2>


<div id="followersList"></div>


</div>



</div>





<script>


fetch("https://panel-ao8e.onrender.com/api/stats")

.then(res=>res.json())

.then(data=>{


document.getElementById("name").innerHTML =
data.profile.name;


document.getElementById("owner").innerHTML =
"Sahibi: " + data.profile.owner;



document.getElementById("kickFollowers").innerHTML =
data.kick.followers.toLocaleString();



document.getElementById("kickSubs").innerHTML =
"Abone: " + data.kick.subscribers;



document.getElementById("youtube").innerHTML =
data.youtube.subscribers.toLocaleString();



document.getElementById("tiktok").innerHTML =
data.tiktok.followers.toLocaleString();



let list="";


data.kick.latestFollowers.forEach(user=>{

list += `
<div class="user">
👤 ${user}
</div>
`;

});


document.getElementById("followersList").innerHTML=list;



});


</script>


</body>

</html>
